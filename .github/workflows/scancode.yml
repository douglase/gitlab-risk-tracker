name: License scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scancode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scancode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run scancode-toolkit
        # Matches the action's documented usage. `@beta` is a moving
        # ref; Dependabot (see .github/dependabot.yml) is configured to
        # propose pinning to a commit SHA once enabled on main, which
        # would fully address the reproducibility concern.
        uses: aboutcode-org/scancode-action@beta
        with:
          # Scan for licenses, copyrights, and basic file info.
          # Ignore generated docs build output and any local data files.
          options: >-
            --license --copyright --info
            --ignore '**/docs/_build/**'
            --ignore '**/__pycache__/**'
            --ignore '**/public/**'
            --ignore '**/data/history.ndjson'
            --json-pp scancode.json
            --html-app scancode.html
          scancode-version: '32.5.0'
          output-path: scancode-results

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check against allowlist
        run: python scripts/check_scancode_allowlist.py scancode-results

      - name: Upload scancode report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scancode-report
          path: scancode-results/
          retention-days: 30
